spring:
  datasource:
    driver-class-name: org.h2.Driver
    password:
    username: sa
    url: jdbc:h2:mem:testdb

  cloud:
    config:
      enabled: false

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    properties:
      spring.json.trusted.packages: "*"
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      bootstrap-servers: ${spring.embedded.kafka.brokers}
      group-id: "test-product-service"

kafka:
  topics:
    productEventsTopic:
      name: "product-events-topic"
      numPartitions: 1
      replicas: 1
      inSyncReplicas: 1
    productCreateSaga:
      name: "product-create-saga-topic"
      numPartitions: 1
      replicas: 1
      inSyncReplicas: 1
eureka:
  client:
    enabled: false

application:
  caching:
    product-cache-properties:
      name: "product-cache"
      expire-after-access-in-seconds: 300
      expire-after-write-in-seconds: 900
      max-size: 250

    category-cache-properties:
      name: "category-cache"
      expire-after-access-in-seconds: 900
      expire-after-write-in-seconds: 300
      max-size: 10
  saga:
    scheduler-delay: 5_000


logging:
    level:
      root: DEBUG

