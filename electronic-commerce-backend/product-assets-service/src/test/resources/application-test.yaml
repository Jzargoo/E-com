spring:

  h2:
    console:
      enabled: true
      path: /h2-console
  r2dbc:
    url: r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    name:
    password:

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DATABASE_TO_UPPER=FALSE

  datasource:
    password:
    user:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DATABASE_TO_UPPER=FALSE
    driver-class-name: org.h2.Driver

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    properties:
      spring.json.trusted.packages: "*"
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      bootstrap-servers: ${spring.embedded.kafka.brokers}
      group-id: "test-product-service"

  cloud:
    discovery:
      enabled: false
    config:
      enabled: false

  config:
    import: ""
eureka:
  client:
    enabled: false

kafka:
  topics:
    productAssetsDebeziumTopicName: "productassetsdbserver1.public.product_assets"
    productCreateSaga:
      name: "product-create-saga-topic"
      numPartitions: 2
      replicas: 2
      inSyncReplicas: 1
  group-id: ${spring.kafka.consumer.group-id}

application:
  media:
    defaultAvatarUri: /default-avatar.png
  fallback-media:
    portion-size: 65536
  server:
    max-header-size: 16484 # 16 * 1024
    max-initial-line-length: 8192 # 8 * 1024
    buffer-size: 65536 # 64 * 1024
    max-content-byte-count: 104857600 # 100 * 1024 * 1024
  grpc:
    channel-media-name: "media-service"
    portion-size: 65536 # 64 * 1024
logging:
  level:
    org.apache.kafka: ERROR
    kafka: ERROR