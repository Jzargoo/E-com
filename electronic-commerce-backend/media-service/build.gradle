plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}
ext {
    springCloudVersion = "2025.1.2"
}

group = 'com.jzargo'
version = '0.0.1-SNAPSHOT'
description = 'media-service'

def os = org.gradle.internal.os.OperatingSystem.current()
def nativePlatform= os.isWindows() ? 'windows-x86_64' : os.isMacOsX() ? 'macosx-arm64' : 'linux-x86_64'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation platform ("io.awspring.cloud:spring-cloud-aws-dependencies:4.1.0")
    implementation "io.awspring.cloud:spring-cloud-aws-starter-s3"

    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-grpc-server'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-grpc-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'com.jzargo:protobuf-common:1.0-SNAPSHOT'

    implementation 'org.bytedeco:javacv:1.5.11'

    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-minio'

    implementation "org.bytedeco:ffmpeg:8.0.1-1.5.13:$nativePlatform"
    implementation "org.bytedeco:opencv:4.13.0-1.5.13:$nativePlatform"
    implementation "org.bytedeco:openblas:0.3.31-1.5.13:$nativePlatform"


    implementation 'org.apache.tika:tika-core:3.2.2'
}
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
